<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="15">
  <!-- RTL off and on, as the Claude desktop app draws a Hebrew reply. The lines are the same text both times:
       "off" is how the bidi algorithm lays it out by itself, "on" carries the marks hooks/rtl.ts adds
       (an isolate around inline code and around an English sentence). The browser lays out both. -->
  <defs>
    <g id="code-chip">
      <rect width="100" height="22" rx="5" fill="#363531"/>
    </g>
  </defs>

  <rect width="820" height="400" rx="12" fill="#1f1e1c"/>

  <!-- RTL off -->
  <text x="24" y="30" font-size="11" fill="#7a7975">RTL off</text>
  <rect x="16" y="40" width="788" height="150" rx="10" fill="#262523"/>
  <g direction="rtl">
    <text x="780" y="78" fill="#ecebe8">• הפונקציה smartFix() מתקנת רק מילים שגויות.</text>
    <text x="780" y="118" fill="#ecebe8">• ה-mod רץ בתוך Claude Code, וזה עובד!</text>
    <text x="780" y="158" fill="#ecebe8">• שורה באנגלית: This line is English only.</text>
  </g>
  <g font-size="12" fill="#e5534b">
    <text x="40" y="78">✗ ()smartFix</text>
    <text x="40" y="158">✗ the period jumped</text>
  </g>

  <!-- RTL on -->
  <text x="24" y="230" font-size="11" fill="#7a7975">RTL on</text>
  <rect x="16" y="240" width="788" height="150" rx="10" fill="#262523"/>
  <g direction="rtl">
    <text x="780" y="278" fill="#ecebe8">• הפונקציה &#x2066;smartFix()&#x2069; מתקנת רק מילים שגויות.</text>
    <text x="780" y="318" fill="#ecebe8">• ה-mod רץ בתוך Claude Code, וזה עובד!</text>
    <text x="780" y="358" fill="#ecebe8">• שורה באנגלית: &#x2066;This line is English only.&#x2069;</text>
  </g>
  <g font-size="12" fill="#3fb950">
    <text x="40" y="278">✓ smartFix()</text>
    <text x="40" y="358">✓ the sentence keeps its period</text>
  </g>
</svg>
